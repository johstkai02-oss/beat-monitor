<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BeatMonitor - Nivel de Audio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
  body{background:#090d16;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;padding:16px}
  .panel{width:100%;max-width:400px;background:#111827;border:1px solid #374151;border-radius:16px;padding:18px}
  h1{font-size:13px;color:#10b981;text-align:center;margin-bottom:14px}
  .meter-box{width:100%;height:38px;background:#1f2937;border-radius:8px;overflow:hidden;margin-bottom:12px;border:1px solid #4b5563}
  .meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#10b981 0%,#f59e0b 75%,#ef4444 95%);transition:width 0.05s}
  .status{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:16px;color:#9ca3af}
  .clip{padding:4px 8px;border-radius:6px;background:#1f2937;font-weight:bold}
  .clip.active{background:#dc2626;color:#fff}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:8px}
  button{border:none;border-radius:10px;padding:12px;font-size:11px;font-weight:bold;color:#fff}
  .b-mic{background:#059669}.b-rst{background:#374151}
</style>
</head>
<body>
<div class="panel">
  <h1>BEAT MONITOR | CONTROL DE AUDIO</h1>
  <div class="meter-box"><div class="meter-fill" id="bar"></div></div>
  <div class="status">
    <span id="txtLvl">NIVEL: 0%</span>
    <span id="txtPeak">PICO: 0%</span>
    <span class="clip" id="badgeClip">CLIPPING</span>
  </div>
  <div class="grid">
    <button class="b-mic" id="bMic">🎙️ INICIAR MONITOR</button>
    <button class="b-rst" id="bRst">↺ RESET</button>
  </div>
</div>
<script>
const bar=document.getElementById('bar'),txtLvl=document.getElementById('txtLvl'),txtPeak=document.getElementById('txtPeak'),badgeClip=document.getElementById('badgeClip');
let audioCtx,analyser,dataArray,running=false,peak=0;

document.getElementById('bMic').onclick=async()=>{
  if(!audioCtx){
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;
    audioCtx.createMediaStreamSource(s).connect(analyser);
    dataArray=new Uint8Array(analyser.fftSize);
  }
  running=!running;
  document.getElementById('bMic').textContent=running?'⏹️ DETENER':'🎙️ INICIAR MONITOR';
  if(running)loop();
};

document.getElementById('bRst').onclick=()=>{
  peak=0;
  txtPeak.textContent='PICO: 0%';
  badgeClip.classList.remove('active');
};

function loop(){
  if(!running)return;
  requestAnimationFrame(loop);
  analyser.getByteTimeDomainData(dataArray);
  let maxVal=0;
  for(let i=0;i<dataArray.length;i++){
    const v=Math.abs(dataArray[i]-128)/128;
    if(v>maxVal)maxVal=v;
  }
  const pct=Math.min(100,Math.round(maxVal*100));
  bar.style.width=pct+'%';
  txtLvl.textContent='NIVEL: '+pct+'%';
  if(pct>peak){
    peak=pct;
    txtPeak.textContent='PICO: '+peak+'%';
  }
  if(pct>=92)badgeClip.classList.add('active');
}
</script>
</body>
</html>
